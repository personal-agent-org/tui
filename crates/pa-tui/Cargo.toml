[package]
name = "pa-tui"
version.workspace = true
license.workspace = true
edition.workspace = true
description = "Personal Agent terminal UI - chat with your agent from the terminal over the same HTTP API as the web app"

[lib]
name = "pa_tui"
path = "src/lib.rs"

[dependencies]
pa-oidc = { path = "../pa-oidc" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "signal", "net"] }
# TLS trust comes from pa-oidc::tls (system store + SSL_CERT_FILE, webpki only as a fallback),
# handed to reqwest as a preconfigured config -- so an internal CA works here too.
reqwest = { version = "0.13", default-features = false, features = ["rustls-tls-webpki-roots-no-provider", "json", "stream"] }
# Control WebSocket (cancel/status/approvals + server pushes). Shares the rustls/ring
# stack with reqwest; ALPN is pinned to http/1.1 so the WS upgrade isn't offered h2.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The published endpoint-trust document is content-addressed; the client recomputes
# that address over the exact bytes it was served rather than trusting the header.
sha2 = "0.10"
# Ed25519 verification of the discovery signature against the published key, and the
# randomness of each refresh's Idempotency-Key. Already linked through rustls.
ring = "0.17"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
dirs = "5"
anyhow = "1"
zeroize = "1"
base64 = "0.22"
# scrolling-regions: `insert_before` then uses DECSTBM scroll regions and does not have to
# redraw the viewport at all — which is what makes writing the transcript into the terminal's
# own scrollback cheap enough to do per line (personal-agent-org/personal-agent#126).
ratatui = { version = "0.30", features = ["unstable-rendered-line-info", "scrolling-regions"] }
crossterm = { version = "0.28", features = ["event-stream"] }
# Markdown → styled ratatui Text (assistant/user message bodies). No longer pinned: the exact
# pin existed to hold ratatui at 0.29, and it was holding the whole crate back with it.
tui-markdown = "0.3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
# Snapshot tests for the render helpers: a rendering change shows up as a reviewable diff
# instead of being noticed in a screenshot three weeks later.
insta = "1"

[package]
name = "pa-oidc"
version.workspace = true
license.workspace = true
edition.workspace = true
description = "Personal Agent client TLS trust (system roots + SSL_CERT_FILE) and the legacy OAuth refresh grant"

[lib]
name = "pa_oidc"
path = "src/lib.rs"

[dependencies]
# This crate owns the workspace's TLS trust decision (see src/tls.rs) and hands a
# preconfigured rustls config to reqwest, so the roots come from the SYSTEM store rather than
# only the compiled-in Mozilla set. Every other client crate goes through it.
reqwest = { version = "0.13", default-features = false, features = ["rustls-tls-webpki-roots-no-provider", "json"] }
rustls = { version = "0.23", features = ["ring"] }
# Reads the OS trust store, and honours SSL_CERT_FILE / SSL_CERT_DIR with it.
rustls-native-certs = "0.8"
# Fallback only, for machines with no system store at all (scratch containers).
webpki-roots = "0.26"
# The same verifier rustls uses; only for the name check of an explicitly pinned certificate.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
anyhow = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }

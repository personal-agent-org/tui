name: Release

on:
  workflow_dispatch:
    inputs:
      minor:
        description: "MINOR version within this month; leave empty to continue from the tags"
        required: false

permissions:
  contents: write
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: pa-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: pa-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: pa-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build pa for ${{ matrix.target }}
        run: cargo build --release --target ${{ matrix.target }} -p pa
      - name: Stage the binary under its asset name
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/pa"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          cp "$bin" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: bins
          merge-multiple: true
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Compute CalVer
        id: version
        run: |
          prefix="$(date -u +%Y).$(date -u +%-m)"
          minor="${{ github.event.inputs.minor }}"
          if [ -z "$minor" ]; then
            git fetch --tags --force --quiet || true
            last=-1
            for tag in $(git tag -l "${prefix}.*"); do
              number="${tag##${prefix}.}"
              case "$number" in ''|*[!0-9]*) continue ;; esac
              [ "$number" -gt "$last" ] && last="$number"
            done
            minor=$((last + 1))
          fi
          case "$minor" in ''|*[!0-9]*) echo "MINOR must be numeric" >&2; exit 1 ;; esac
          echo "version=${prefix}.${minor}" >> "$GITHUB_OUTPUT"
      - name: Tag and publish signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          (cd bins && sha256sum pa-* > SHA256SUMS)
          cosign sign-blob --yes --bundle bins/SHA256SUMS.sigstore.json bins/SHA256SUMS
          git rev-parse "$version" >/dev/null 2>&1 || {
            git tag "$version"
            git push origin "$version"
          }
          gh release view "$version" >/dev/null 2>&1 || \
            gh release create "$version" --title "$version" --generate-notes
          gh release upload "$version" --clobber \
            bins/pa-linux-x64 bins/pa-macos-arm64 bins/pa-windows-x64.exe \
            bins/SHA256SUMS bins/SHA256SUMS.sigstore.json
